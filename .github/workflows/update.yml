name: Fetch media and rebuild site

# On every push: download any new media and rebuild the README, REPOS.md and the website.

on:
  push:
    branches: [main]
    paths: ["sources/**", "content/**", "tools/**", "README.md", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python tools/fetch_media.py
      - run: python tools/build_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; else git commit -m "Fetch media and rebuild site" && git push; fi
